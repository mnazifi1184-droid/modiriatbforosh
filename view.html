<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>نمایش داده‌ها | مدیریت فروش</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a href="dashboard.html" class="brand">داشبورد</a>
      <nav class="nav" id="main-nav">
        <a href="view.html" class="active">نمایش داده‌ها</a>
        <a href="upload.html" id="nav-upload" hidden>آپلود اکسل</a>
        <a href="admin.html" id="nav-admin" hidden>مدیریت کاربران</a>
        <button class="logout-btn" id="btn-logout">خروج</button>
      </nav>
    </div>
  </header>

  <main class="container" style="max-width: 1100px;">
    <div id="content" hidden>
      <div class="view-header">
        <div>
          <h1>داده‌های فایل: <span id="file-name"></span></h1>
          <p class="file-meta" id="file-meta"></p>
        </div>
        <span class="badge" id="row-badge"></span>
      </div>

      <div class="sheet-tabs" id="sheet-tabs" hidden></div>

      <div class="toolbar">
        <input type="search" id="search" class="search" placeholder="جستجو در این شیت…" aria-label="جستجو در داده‌ها">
      </div>

      <div class="table-wrap">
        <table id="data-table">
          <thead id="table-head"></thead>
          <tbody id="table-body"></tbody>
        </table>
      </div>
    </div>

    <div id="empty-state" class="empty" hidden>
      <strong>هنوز داده‌ای منتشر نشده</strong>
      <p style="margin:0">داده‌ها از گوگل‌شیت خوانده می‌شوند؛ اگر باز نشد، اتصال به گوگل (VPN) یا اشتراک‌گذاری عمومی شیت را بررسی کنید.</p>
      <p style="margin-top:16px"><a href="login.html" class="btn primary" style="text-decoration:none; display:inline-block">رفتن به صفحه‌ی ورود ←</a></p>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container">مدیریت فروش — دسترسی به داده‌ها فقط برای کاربران واردشده</div>
  </footer>

  <script src="view.js"></script>
  <script>if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js"))}</script>
</body>
</html>

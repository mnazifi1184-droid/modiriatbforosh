<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>نمایش داده‌ها | مدیریت فروش</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a href="index.html" class="brand">مدیریت فروش</a>
      <nav class="nav">
        <a href="index.html">آپلود اکسل</a>
        <a href="view.html" class="active">نمایش داده‌ها</a>
      </nav>
    </div>
  </header>

  <main class="container" style="max-width: 1100px;">
    <div id="content" hidden>
      <div class="view-header">
        <h1>داده‌های فایل: <span id="file-name"></span></h1>
        <span class="badge" id="row-badge"></span>
      </div>

      <div class="toolbar">
        <input type="search" id="search" class="search" placeholder="جستجو در داده‌ها…" aria-label="جستجو در داده‌ها">
        <button class="btn danger-outline" id="btn-delete" style="margin-top:0">حذف داده‌ها</button>
      </div>

      <div class="table-wrap">
        <table id="data-table">
          <thead id="table-head"></thead>
          <tbody id="table-body"></tbody>
        </table>
      </div>
    </div>

    <div id="empty-state" class="empty" hidden>
      <strong>هنوز داده‌ای بارگذاری نشده</strong>
      <p style="margin:0">ابتدا از صفحه‌ی «آپلود اکسل» یک فایل بارگذاری کنید.</p>
      <a href="index.html" class="btn primary" style="display:inline-block; margin-top:16px; text-decoration:none">رفتن به صفحه‌ی آپلود ←</a>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container">مدیریت فروش — داده‌ها فقط در مرورگر شما ذخیره می‌شوند</div>
  </footer>

  <script src="view.js"></script>
  <script>if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js"))}</script>
</body>
</html>

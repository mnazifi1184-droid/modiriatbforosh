<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ورود — مدیریت فروش</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
</head>
<body class="auth-page">
  <main class="auth-card">
    <svg class="auth-logo" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
      <rect x="4" y="10" width="16" height="10" rx="2"/>
      <path d="M8 10V7a4 4 0 0 1 8 0v3"/>
      <circle cx="12" cy="15" r="1.5" fill="currentColor" stroke="none"/>
    </svg>
    <h1>مدیریت فروش</h1>
    <p class="auth-sub">برای ادامه وارد شوید</p>

    <form id="login-form">
      <label class="field">
        <span>نام کاربری</span>
        <input type="text" id="login-username" autocomplete="username" required>
      </label>
      <label class="field">
        <span>رمز عبور</span>
        <input type="password" id="login-password" autocomplete="current-password" required>
      </label>

      <div class="msg error" id="login-error" hidden></div>
      <div class="msg success" id="login-success" hidden></div>

      <button type="submit" class="btn primary auth-btn" id="login-btn">ورود</button>
    </form>

    <p class="auth-foot">اتصال به گوگل لازم است — در ایران معمولاً با VPN</p>
  </main>

  <script src="config.js"></script>
  <script src="login.js"></script>
</body>
</html>
